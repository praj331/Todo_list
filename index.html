<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
  }

  body {
    background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .container {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .completed {
    text-decoration: line-through;
    color: gray;
}

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  .input-group {
    display: flex;
    gap: 10px;
  }

  input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
  }

  button {
    padding: 10px 15px;
    border: none;
    background: #4CAF50;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #43a047;
  }

  ul {
    margin-top: 20px;
  }

  li {
    list-style: none;
    background: #f4f4f4;
    padding: 10px;
    border-radius: 8px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.3s;
  }

  li:hover {
    transform: scale(1.02);
  }

  li.completed span {
    text-decoration: line-through;
    color: gray;
  }

  .delete-btn {
    background: red;
    padding: 6px 10px;
    border-radius: 6px;
    color: white;
    cursor: pointer;
  }

  .delete-btn:hover {
    background: darkred;
  }

  /* 📱 Mobile */
  @media (max-width: 500px) {
    .container {
      padding: 15px;
    }

    h1 {
      font-size: 22px;
    }

    button {
      padding: 8px 10px;
    }
  }
</style>
</head>

<body>

<div class="container">
  <h1>📝 Todo App</h1>

  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Enter a task...">
    <button onclick="addTask()"><i class="fas fa-plus"></i></button>
  </div>

  <ul id="taskList"></ul>
</div>
<script src="Todo_app.js"></script>

</body>
</html>
